name: Screenie
options:
  bundleIdPrefix: com.dustinmichels
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Screenie:
    type: application
    platform: macOS
    sources:
      - Screenie
    info:
      path: Screenie/Info.plist
      properties:
        CFBundleDisplayName: Screenie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSDesktopFolderUsageDescription: Screenie lists the screenshots macOS saves to your Desktop.
        NSDocumentsFolderUsageDescription: Screenie lists the screenshots macOS saves to your Documents folder.
        NSDownloadsFolderUsageDescription: Screenie lists the screenshots macOS saves to your Downloads folder.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dustinmichels.Screenie
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
