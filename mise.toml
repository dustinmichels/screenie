[tools]
xcodegen = "2.46.0"
bun = "1.4.4"

[tasks.generate]
description = "Regenerate Screenie.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.build]
description = "Build the Release app into build/DerivedData"
run = "xcodebuild -project Screenie.xcodeproj -scheme Screenie -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData build -quiet"

[tasks.dev]
description = "Build the Debug app and run it from build/ in this terminal (Ctrl-C quits)"
run = """
set -eu
xcodebuild -project Screenie.xcodeproj -scheme Screenie -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData build -quiet
mise run quit
exec build/DerivedData/Build/Products/Debug/Screenie.app/Contents/MacOS/Screenie
"""

[tasks.install]
description = "Build, replace /Applications/Screenie.app, launch it, then clean build/"
depends = ["build"]
run = """
set -eu
mise run quit
rm -rf /Applications/Screenie.app
cp -R build/DerivedData/Build/Products/Release/Screenie.app /Applications/
open /Applications/Screenie.app
mise run cleanup
"""

[tasks.quit]
description = "Quit Screenie if it's running"
hide = true
run = """
set -eu
if pgrep -xq Screenie; then
  osascript -e 'quit app id "com.dustinmichels.Screenie"'
  i=0
  while pgrep -xq Screenie; do
    i=$((i + 1))
    if [ "$i" -ge 50 ]; then echo "Screenie didn't quit; quit it and rerun." >&2; exit 1; fi
    sleep 0.1
  done
fi
"""

[tasks.cleanup]
description = "Delete build/ (DerivedData, archives, release artifacts)"
run = "rm -rf build"

[tasks.release]
description = "Bump the version (patch by default; or minor, major, X.Y.Z), notarize, tag, publish a GitHub release with Screenie.dmg and Screenie.zip, and update the Homebrew cask"
run = "scripts/release.sh"

[tasks.cask]
description = "Point the Homebrew cask in dustinmichels/homebrew-tap at a release (default: the latest)"
run = "scripts/update-cask.sh"

[tasks.docs]
description = "Preview the docs site"
dir = "docs"
run = "bun install && bun run dev"
